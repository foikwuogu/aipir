# Lab-mode AIPIR stack: detector + OpenTelemetry Collector + Prometheus + Alertmanager + Grafana.
#   ./deploy/compose/gen-lab-secrets.sh          # once: lab secret + workload tokens (git-ignored)
#   docker compose -f deploy/compose/docker-compose.yml up --build
services:
  aipir:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    env_file: [.lab/lab-secrets.env]
    environment:
      AIPIR_AUTH_MODE: hs256
      AIPIR_ISSUER: aipir-lab
      AIPIR_AUDIENCE: "api://aipir"
      AIPIR_RECOVERY: dry-run
      AIPIR_AUDIT_LOG: /var/log/aipir/audit.jsonl
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ../../data/raw/hai-21.03:/data:ro
      - audit:/var/log/aipir
    ports: ["9108:9108"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on: [otel-collector]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../observability/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318", "8889:8889"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./.lab/prometheus:/etc/prometheus/secrets:ro
    ports: ["9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.lab/alertmanager:/etc/alertmanager/secrets:ro
    ports: ["9093:9093"]
  grafana:
    image: grafana/grafana:11.1.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "false", GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false" }
    volumes: ["../observability/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
volumes:
  audit: {}
