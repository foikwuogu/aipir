# Zero-Trust network posture: default deny for the namespace, then explicit allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: aipir }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: aipir-detector, namespace: aipir }
spec:
  podSelector: { matchLabels: { app: aipir-detector } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 9108 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }]
    - to: [{ podSelector: { matchLabels: { app: otel-collector } } }]
      ports: [{ port: 4318 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: otel-collector, namespace: aipir }
spec:
  podSelector: { matchLabels: { app: otel-collector } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: aipir-detector } } }]
      ports: [{ port: 4318 }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 8889 }]
