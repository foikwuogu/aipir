# The collector configuration is deploy/observability/otel/otel-collector.yaml; create it with
#   kubectl -n aipir create configmap otel-collector --from-file=config.yaml=deploy/observability/otel/otel-collector.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: aipir
  labels: { app: otel-collector, app.kubernetes.io/part-of: aipir }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: prom-export, containerPort: 8889 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/otelcol, readOnly: true }]
      volumes:
        - { name: config, configMap: { name: otel-collector } }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: aipir }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: prom-export, port: 8889, targetPort: prom-export }
