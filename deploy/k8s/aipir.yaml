# AIPIR on Kubernetes (any conformant cluster: AKS, EKS, GKE, on-prem k3s at the plant edge).
# Applied by Terraform (deploy/terraform) or directly: kubectl apply -f deploy/k8s/aipir.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: aipir
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aipir-detector
  namespace: aipir
  labels: { app: aipir-detector, layer: predict }
spec:
  replicas: 2                       # Recover: a failed replica is replaced automatically
  revisionHistoryLimit: 5           # Recover: `kubectl rollout undo` to a known-good model
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: aipir-detector } }
  template:
    metadata:
      labels: { app: aipir-detector }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9108" }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: detector
          image: ghcr.io/OWNER/aipir:0.1.0     # set by Terraform var.image
          args: ["--model", "models/aipir_hai2103.joblib", "--replay", "/data/test2.csv.gz", "--speed", "60"]
          ports: [{ name: metrics, containerPort: 9108 }]
          env: [{ name: AIPIR_RECOVERY, value: "dry-run" }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /healthz, port: metrics }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: metrics }, periodSeconds: 10, failureThreshold: 3 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: telemetry, mountPath: /data, readOnly: true }]
      volumes:
        - name: telemetry
          persistentVolumeClaim: { claimName: aipir-telemetry }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: aipir-telemetry, namespace: aipir }
spec:
  accessModes: [ReadOnlyMany]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: aipir-detector, namespace: aipir, labels: { app: aipir-detector } }
spec:
  selector: { app: aipir-detector }
  ports: [{ name: metrics, port: 9108, targetPort: metrics }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: aipir-detector, namespace: aipir }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: aipir-detector } }
---
# OT segmentation: the detector accepts only scrapes/webhooks from the monitoring
# namespace and has no egress at all (it never writes to the control network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: aipir-detector-isolation, namespace: aipir }
spec:
  podSelector: { matchLabels: { app: aipir-detector } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 9108 }]
  egress: []
