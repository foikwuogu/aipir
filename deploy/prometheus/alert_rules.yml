groups:
  - name: aipir-resilience
    rules:
      # Respond: one alert per routed sub-process. The detector already debounces
      # (5 s persistence, 30 s merge gap), so no extra `for:` delay is added here.
      - alert: AIPIRProcessAnomaly
        expr: max by (process) (aipir_alarm) == 1
        labels: { severity: critical, layer: respond }
        annotations:
          summary: "AIPIR anomaly routed to {{ $labels.process }}"
          description: "Predictive residual above calibrated threshold; recovery playbook for {{ $labels.process }} requested."
      - alert: AIPIRScoreElevated
        expr: aipir_anomaly_score > 0.8 * aipir_threshold
        for: 30s
        labels: { severity: warning, layer: predict }
        annotations: { summary: "AIPIR score approaching threshold (early warning)" }
      - alert: AIPIRTelemetryStalled
        expr: rate(aipir_rows_processed_total[1m]) == 0
        for: 2m
        labels: { severity: critical, layer: observe }
        annotations: { summary: "No telemetry scored for 2 minutes (observability gap)" }
