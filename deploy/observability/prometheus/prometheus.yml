global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: ["/etc/prometheus/alert_rules.yml"]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  # Zero-Trust: Prometheus authenticates with a workload token (role aipir.metrics-scraper).
  - job_name: aipir
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/scraper.token
    static_configs: [{ targets: ["aipir:9108"] }]
  # Metrics re-exported by the OpenTelemetry Collector (otel_* series).
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
