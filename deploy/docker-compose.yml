# Lab-mode AIPIR stack: detector + Prometheus + Alertmanager + Grafana.
# Run from the repository root:  docker compose -f deploy/docker-compose.yml up --build
services:
  aipir:
    build: { context: .., dockerfile: deploy/Dockerfile }
    volumes: ["../data/raw/hai-21.03:/data:ro"]
    ports: ["9108:9108"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
  grafana:
    image: grafana/grafana:11.1.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer" }
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
