name: pages
on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "AUTHORS.json"
      - "CITATION.cff"
      - "docs/release_ids.json"
      - "data/processed/lab_stack_check.json"
      - "data/processed/iac_validation.txt"
      - "code/09_dashboard.py"
      - "dashboard/style.css"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python code/09_dashboard.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
